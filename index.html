const PRESENCE_DB='';

function olPaint(){document.querySelectorAll('.olc').forEach(e=>e.textContent=OLN.n);document.querySelectorAll('.olp').forEach(p=>{p.classList.toggle('off',OLN.off);p.title=PRESENCE_DB?L2('ผู้ใช้ที่ออนไลน์ตอนนี้','Users online now'):L2('นับเฉพาะแท็บในเบราว์เซอร์นี้ (ยังไม่ได้ตั้งค่าเซิร์ฟเวอร์)','Counting tabs in this browser only (no server configured)')})}

(function(){
 if(!PRESENCE_DB){ // local fallback: count tabs via BroadcastChannel
  try{const bc=new BroadcastChannel('tj_presence'),seen={};const tick=()=>{const now=Date.now();seen[OLN.id]=now;Object.keys(seen).forEach(k=>{if(now-seen[k]>OLN.ttl)delete seen[k]});OLN.n=Object.keys(seen).length;olPaint();bc.postMessage(OLN.id)};bc.onmessage=e=>{seen[e.data]=Date.now();OLN.n=Object.keys(seen).length;olPaint()};tick();setInterval(tick,OLN.beat/2);addEventListener('pagehide',()=>bc.postMessage('bye:'+OLN.id));bc.addEventListener('message',e=>{if(String(e.data).startsWith('bye:')){delete seen[String(e.data).slice(4)];OLN.n=Object.keys(seen).length||1;olPaint()}})}catch(e){}
  return}
 const now=()=>Date.now()+OLN.skew;
 async function beat(){try{const r=await fetch(olUrl(OLN.id),{method:'PUT',body:JSON.stringify({'.sv':'timestamp'}),keepalive:true});const ts=await r.json();if(typeof ts=='number')OLN.skew=ts-Date.now();OLN.off=false}catch(e){OLN.off=true;olPaint()}}
 async function count(){try{const r=await fetch(olUrl());const d=(await r.json())||{},n=now(),stale={};let c=0;for(const[k,v]of Object.entries(d)){if(typeof v!='number'||n-v>OLN.ttl){if(typeof v!='number'||n-v>3e5)stale[k]=null}else c++}
  OLN.n=Math.max(1,c);OLN.off=false;olPaint();if(Object.keys(stale).length)fetch(olUrl(),{method:'PATCH',body:JSON.stringify(stale)}).catch(()=>{})}catch(e){OLN.off=true;olPaint()}}
 const run=async()=>{await beat();await count()};
 run();setInterval(run,OLN.beat);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)run()});
 addEventListener('pagehide',()=>{try{fetch(olUrl(OLN.id),{method:'DELETE',keepalive:true})}catch(e){}});
})();
